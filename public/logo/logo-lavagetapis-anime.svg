<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="800" height="680">
<title>lavagetapis.fr</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&amp;display=swap');
  .bub{transform-box:fill-box;transform-origin:center;animation:rise 4.2s ease-in infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}18%{opacity:.95}100%{transform:translateY(-78px) scale(1.15);opacity:0}}
  .fr-l,.fr-r{transform-box:fill-box;animation:sway 2.6s ease-in-out infinite alternate}
  .fr-l{transform-origin:right center}.fr-r{transform-origin:left center;animation-delay:-1.3s}
  @keyframes sway{from{transform:skewY(-5deg) scaleX(.94)}to{transform:skewY(5deg) scaleX(1.04)}}
  .wave-foam circle{transform-box:fill-box;transform-origin:center;animation:pop .9s ease-in-out infinite alternate}
  @keyframes pop{from{transform:scale(.7)}to{transform:scale(1.15)}}
  .wm{font-family:Archivo,'Arial Black',Arial,sans-serif;font-stretch:125%;letter-spacing:-2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.bub{opacity:0}}
</style>
<defs>
    <pattern id="chain" x="40" y="44" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f9d140"/>
      <path d="M6 2.2 9.8 6 6 9.8 2.2 6z" fill="#00615b"/>
    </pattern>
    <filter id="splotch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
  </defs>

          
          <defs>
            <clipPath id="rugClip"><rect x="30" y="34" width="340" height="198" rx="7"/></clipPath>
            <mask id="dirtMask" maskUnits="userSpaceOnUse" x="-100" y="0" width="1200" height="270">
              <rect x="-50" y="0" width="900" height="270" fill="#fff">
                <animate id="washA" attributeName="x" from="-50" to="470" dur="2.4s" begin="0.7s;logoHit.click" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".6 .05 .35 1"/>
              </rect>
            </mask>
            <linearGradient id="waterG" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#bfe9e4" stop-opacity="0"/>
              <stop offset=".65" stop-color="#d9f5f2" stop-opacity=".55"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
            </linearGradient>
            <linearGradient id="shineG" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>

          
    <g class="fr-l" stroke="#00615b" stroke-width="2.4" stroke-linecap="round">
      <path d="M30 42h-15M30 49h-12M30 56h-16M30 63h-13M30 70h-15M30 77h-12M30 84h-16M30 91h-13M30 98h-15M30 105h-12M30 112h-16M30 119h-13M30 126h-15M30 133h-12M30 140h-16M30 147h-13M30 154h-15M30 161h-12M30 168h-16M30 175h-13M30 182h-15M30 189h-12M30 196h-16M30 203h-13M30 210h-15M30 217h-12M30 224h-16"/>
    </g>
    <g class="fr-r" stroke="#00615b" stroke-width="2.4" stroke-linecap="round">
      <path d="M370 42h15M370 49h12M370 56h16M370 63h13M370 70h15M370 77h12M370 84h16M370 91h13M370 98h15M370 105h12M370 112h16M370 119h13M370 126h15M370 133h12M370 140h16M370 147h13M370 154h15M370 161h12M370 168h16M370 175h13M370 182h15M370 189h12M370 196h16M370 203h13M370 210h15M370 217h12M370 224h16"/>
    </g>
    <rect x="30" y="34" width="340" height="198" rx="7" fill="#00615b"/>
    <rect x="40" y="44" width="320" height="178" rx="2" fill="url(#chain)"/>
    <rect x="52" y="56" width="296" height="154" fill="#00615b"/>
    <rect x="59" y="63" width="282" height="140" fill="none" stroke="#f9d140" stroke-width="1.6" stroke-dasharray="6 4"/>
    <path d="M59 63h40l-40 32zM341 63h-40l40 32zM59 203h40l-40-32zM341 203h-40l40-32z" fill="#f9d140"/>
    <path d="M200 70 270 133 200 196 130 133z" fill="#004843" stroke="#f9d140" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M112 125l8 8-8 8-8-8zM288 125l8 8-8 8-8-8z" fill="#f9d140"/>
    <path d="M200 95c11 15 23 28 23 44a23 23 0 0 1-46 0c0-16 12-29 23-44z" fill="#f9d140"/>
    <path d="M190 137a11 11 0 0 0 6 13" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  

          <!-- grime, washed away by the wave -->
          <g clip-path="url(#rugClip)">
            <g mask="url(#dirtMask)">
              <rect x="30" y="34" width="340" height="198" fill="#6b5a45" opacity=".5"/>
              <g filter="url(#splotch)" fill="#4a3826" opacity=".6">
                <ellipse cx="108" cy="98" rx="26" ry="17"/>
                <ellipse cx="252" cy="182" rx="30" ry="15"/>
                <ellipse cx="306" cy="88" rx="16" ry="12"/>
                <ellipse cx="160" cy="196" rx="15" ry="9"/>
                <ellipse cx="218" cy="110" rx="11" ry="8"/>
              </g>
              <g fill="#3b2c1d" opacity=".55">
                <circle cx="80" cy="150" r="1.6"/><circle cx="140" cy="70" r="1.3"/><circle cx="330" cy="150" r="1.5"/>
                <circle cx="290" cy="205" r="1.2"/><circle cx="190" cy="160" r="1.4"/><circle cx="240" cy="80" r="1.2"/>
              </g>
            </g>
            <!-- the wave -->
            <g>
              <animateTransform attributeName="transform" type="translate" from="0 0" to="520 0" dur="2.4s" begin="0.7s;logoHit.click" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".6 .05 .35 1"/>
              <g>
                <animate attributeName="opacity" values="1;1;0" keyTimes="0;.86;1" dur="2.4s" begin="0.7s;logoHit.click" fill="freeze"/>
                <rect x="-150" y="20" width="110" height="230" fill="url(#waterG)"/>
                <path d="M-40 26c9 9 9 18 0 27s-9 18 0 27 9 18 0 27-9 18 0 27 9 18 0 27-9 18 0 27 9 18 0 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
                <g class="wave-foam" fill="#fff" stroke="#00615b" stroke-width="1.2">
                  <circle cx="-34" cy="52" r="6"/><circle cx="-30" cy="88" r="4"/><circle cx="-36" cy="121" r="7"/>
                  <circle cx="-31" cy="160" r="5"/><circle cx="-35" cy="196" r="6"/><circle cx="-29" cy="222" r="3.5"/>
                  <circle cx="-48" cy="72" r="3"/><circle cx="-50" cy="140" r="3.5"/><circle cx="-47" cy="208" r="2.6"/>
                </g>
              </g>
            </g>
            <!-- periodic shine -->
            <g>
              <animateTransform id="shineA" attributeName="transform" type="translate" from="0 0" to="560 0" dur="1.5s" begin="3.6s;shineA.end+3.5s" fill="freeze"/>
              <rect x="-120" y="10" width="70" height="260" fill="url(#shineG)" transform="skewX(-20)"/>
            </g>
          </g>

          <!-- ambient bubbles -->
          <g fill="#ffffff" fill-opacity=".75" stroke="#00615b" stroke-width="1.6">
            <circle class="bub" cx="92" cy="70" r="7" style="animation-delay:.2s"/>
            <circle class="bub" cx="150" cy="58" r="4.5" style="animation-delay:1.1s;animation-duration:3.6s"/>
            <circle class="bub" cx="205" cy="64" r="9" style="animation-delay:2.4s"/>
            <circle class="bub" cx="262" cy="56" r="5" style="animation-delay:.7s;animation-duration:3.3s"/>
            <circle class="bub" cx="318" cy="72" r="7.5" style="animation-delay:1.9s;animation-duration:4.8s"/>
            <circle class="bub" cx="120" cy="120" r="3.5" style="animation-delay:3s;animation-duration:3.2s"/>
            <circle class="bub" cx="290" cy="130" r="4" style="animation-delay:2.8s;animation-duration:3.9s"/>
            <circle class="bub" cx="350" cy="50" r="3.5" style="animation-delay:3.6s"/>
            <circle class="bub" cx="50" cy="60" r="4" style="animation-delay:1.5s;animation-duration:3.7s"/>
          </g>
          <rect id="logoHit" x="0" y="0" width="400" height="270" fill="transparent"/>
        
<text class="wm" x="200" y="318" text-anchor="middle" font-size="58" fill="#00615b"><tspan font-weight="600">lavage</tspan><tspan font-weight="900">tapis</tspan></text>
</svg>